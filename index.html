<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 맞추고 아이패드 겟하기!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 숫자 맞추고 아이패드 겟하기!! 🎮</h1>
        
        <div class="game-info">
            <div class="level-display">
                <span>현재 도전 레벨: <strong id="current-level">1단계 (쉬움)</strong></span>
            </div>
        </div>
        
            <div class="game-board">
            <div id="player-name-section" class="player-name-section">
                <input type="text" id="player-name" placeholder="참참가자 이름 입력" maxlength="10"/>
            </div>
            <div id="chances" class="chances">기회: 3번</div>
            <div id="range" class="range">범위: 1 ~ 100</div>
            <div id="score">점수: 0</div>
            
            <div id="result" class="result"></div>
            
            <div class="input-group">
                <input type="number" id="user-input" placeholder="숫자를 입력하세요 (1~100)"/>
                <button id="play-button">Go!</button>
            </div>
            
            <div id="guessed-list" class="guessed-list">
                <strong>시도한 숫자:</strong>
                <div id="guessed-numbers"></div>
            </div>
            
            <button id="reset-button">🔄 새 게임</button>
            <button id="rules-button">📋 게임 규칙</button>
        </div>
        
        <div id="rules-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>게임 규칙</h2>
                <ul>
                    <li>1부터 100 사이의 숫자를 맞춰보세요!</li>
                    <li>최대 3번의 기회가 있습니다</li>
                    <li>범위 밖의 숫자나 이전에 입력한 숫자는 기회를 쓰지 않습니다</li>
                    <li>"Up!!", "Down!!!" 힌트를 참고하세요</li>
                    <li>성공하면 더 높은 난이도에 도전할 수 있습니다!</li>
                </ul>
            </div>
        </div>
        
        <div id="next-level-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 축하합니다! 🎉</h2>
                <p id="congrats-message"></p>
                <p>다음 단계를 도전하시겠습니까?</p>
                <div class="modal-buttons">
                    <button id="next-yes-btn" class="modal-btn yes-btn">네, 도전합니다!</button>
                    <button id="next-no-btn" class="modal-btn no-btn">아니오, 종료합니다</button>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
